services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gas_station_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=sqlite:///./data/gas_station.db
      - PYTHONUNBUFFERED=1
    networks:
      - gas_station_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: gas_station_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gas_station_net

volumes:
  backend_data:

networks:
  gas_station_net:
    driver: bridge

